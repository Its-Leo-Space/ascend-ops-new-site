<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/ascend-ai-design-system-9028147f-44c3-4b16-a370-3586912d767f/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/ascend-ai-design-system-9028147f-44c3-4b16-a370-3586912d767f/tokens/colors.css">
  <link rel="stylesheet" href="_ds/ascend-ai-design-system-9028147f-44c3-4b16-a370-3586912d767f/tokens/typography.css">
  <link rel="stylesheet" href="_ds/ascend-ai-design-system-9028147f-44c3-4b16-a370-3586912d767f/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/ascend-ai-design-system-9028147f-44c3-4b16-a370-3586912d767f/styles.css">
  <script src="_ds/ascend-ai-design-system-9028147f-44c3-4b16-a370-3586912d767f/_ds_bundle.js"></script>
  <style>
    .nav-logo { height:clamp(26px,3.2vw,36px); width:auto; max-width:160px; display:block; filter:brightness(1.35) contrast(1.1); }
    @media (max-width: 1100px) {
      nav > div { gap:14px !important; }
    }
    @media (max-width: 480px) {
      .nav-logo { height:24px; max-width:120px; }
      nav > div { padding-left:20px !important; padding-right:20px !important; max-width:100% !important; }
    }
  </style>
</helmet>
<nav style="position:sticky;top:0;z-index:100;background:var(--black);border-bottom:1px solid var(--gray-3);">
  <div style="max-width:1440px;margin:0 auto;padding:0 40px;height:auto;min-height:68px;display:flex;align-items:center;justify-content:center;gap:24px;position:relative;z-index:1;">
    <a href="Home.dc.html" style="display:flex;align-items:center;gap:10px;flex-shrink:0;min-width:0;margin-right:auto;" aria-label="Ascend Ops home">
      <img src="assets/logo-ascendops-final.png" alt="Ascend Ops" class="nav-logo" loading="eager" decoding="async" fetchpriority="high">
    </a>

    <sc-if value="{{isDesktop}}" hint-placeholder-val="{{true}}">
      <div style="display:flex;align-items:center;gap:28px;flex-shrink:1;min-width:0;flex-wrap:nowrap;justify-content:center;">
        <sc-for list="{{centerLinks}}" as="link" hint-placeholder-count="4">
          <a href="{{link.href}}" style="display:inline-block;font-family:'Inter',sans-serif;font-size:0.85rem;color:{{link.color}};font-weight:{{link.weight}};text-decoration:none;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1),filter 0.25s ease,text-shadow 0.25s ease;" style-hover="transform:translateY(-2px) scale(1.05);filter:brightness(1.25);text-shadow:0 0 8px rgba(255,255,255,0.4);">{{link.label}}</a>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isDesktop}}" hint-placeholder-val="{{true}}">
      <div style="display:flex;align-items:center;gap:24px;flex-shrink:0;">
        <a href="https://tally.so/r/2EyKqD?utm_source=site&utm_medium=nav&utm_campaign=nav_desktop" target="_blank" rel="noopener noreferrer" style="font-family:var(--font-body);font-weight:600;font-size:0.85rem;background:var(--white);color:var(--black);padding:10px 20px;border-radius:var(--radius-pill);text-decoration:none;white-space:nowrap;flex-shrink:0;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1),box-shadow .25s ease,filter .25s ease;" style-hover="transform:translateY(-2px) scale(1.04);filter:brightness(1.08);box-shadow:0 0 16px rgba(255,255,255,0.3);">Assess Your Infra Gaps</a>
      </div>
    </sc-if>

    <sc-if value="{{isMobile}}" hint-placeholder-val="{{false}}">
      <div style="display:flex;align-items:center;gap:14px;">
        <a href="https://tally.so/r/2EyKqD?utm_source=site&utm_medium=nav&utm_campaign=nav_mobile" target="_blank" rel="noopener noreferrer" style="font-family:var(--font-body);font-weight:600;font-size:0.85rem;background:var(--white);color:var(--black);padding:9px 16px;border-radius:var(--radius-pill);text-decoration:none;white-space:nowrap;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1),box-shadow .25s ease;" style-hover="transform:scale(1.03);box-shadow:0 0 14px rgba(255,255,255,0.3);">Assess Your Infra Gaps</a>
        <button onClick="{{toggleMenu}}" aria-label="Menu" style="width:40px;height:40px;border:1px solid var(--gray-3);border-radius:var(--radius-sm);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;">
          <span style="display:block;width:18px;height:1.5px;background:var(--white);"></span>
          <span style="display:block;width:18px;height:1.5px;background:var(--white);"></span>
        </button>
      </div>
    </sc-if>
  </div>

</nav>

<div style="{{backdropStyle}}" onClick="{{closeMenu}}" aria-hidden="true"></div>
<div style="{{drawerStyle}}" role="dialog" aria-label="Menu">
  <div style="display:flex;justify-content:flex-end;padding:16px 20px 4px;">
    <button onClick="{{closeMenu}}" aria-label="Close menu" style="width:44px;height:44px;border:1px solid var(--gray-3);border-radius:var(--radius-sm);background:transparent;color:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;line-height:1;">&#10005;</button>
  </div>
  <div style="display:flex;flex-direction:column;gap:2px;padding:8px 28px 28px;">
    <sc-for list="{{allLinksMobile}}" as="link" hint-placeholder-count="6">
      <a href="{{link.href}}" style="font-size:1.05rem;color:{{link.color}};font-weight:{{link.weight}};text-decoration:none;padding:14px 4px;min-height:48px;display:flex;align-items:center;border-bottom:1px solid var(--gray-3);border-radius:8px;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1),filter 0.25s ease;" style-active="transform:scale(1.04);filter:brightness(1.3);">{{link.label}}</a>
    </sc-for>
    <a href="https://tally.so/r/2EyKqD?utm_source=site&utm_medium=nav&utm_campaign=nav_mobile_menu" target="_blank" rel="noopener noreferrer" style="margin-top:20px;text-align:center;justify-content:center;min-height:48px;display:flex;align-items:center;font-family:var(--font-body);font-weight:600;font-size:0.95rem;background:var(--white);color:var(--black);padding:14px 22px;border-radius:var(--radius-pill);text-decoration:none;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1),filter 0.25s ease;" style-active="transform:scale(1.03);filter:brightness(1.08);">Assess Your Infra Gaps</a>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;activePage&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;home&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;home&quot;, &quot;about&quot;, &quot;process&quot;, &quot;solutions&quot;, &quot;work&quot;, &quot;price&quot;, &quot;contact&quot;]}}">
class Component extends DCLogic {
  state = { scrolled: false, mobileOpen: false, isDesktop: true };

  componentDidMount() {
    this._onScroll = () => this.setState({ scrolled: window.scrollY > 24 });
    this._onResize = () => this.setState({ isDesktop: window.innerWidth >= 1130, mobileOpen: window.innerWidth >= 1130 ? false : this.state.mobileOpen });
    window.addEventListener('scroll', this._onScroll, { passive: true });
    window.addEventListener('resize', this._onResize);
    this._onResize();
  }

  componentWillUnmount() {
    window.removeEventListener('scroll', this._onScroll);
    window.removeEventListener('resize', this._onResize);
  }

  renderVals() {
    const active = this.props.activePage || '';
    const defs = [
      { key: 'solutions', label: 'Systems', href: 'Solutions.dc.html' },
      { key: 'process', label: 'Methodology', href: 'Process.dc.html' },
      { key: 'price', label: 'Investment', href: 'Price.dc.html' },
      { key: 'about', label: 'Company', href: 'Company.dc.html' },
      { key: 'work', label: 'Engagement', href: 'WorkWithUs.dc.html' },
    ];
    const centerLinks = defs.map(l => ({
      ...l,
      color: active === l.key ? 'var(--white)' : 'var(--text-body-dark)',
      weight: active === l.key ? 600 : 400,
    }));
    const aboutActive = active === 'about';
    const allDefs = defs;
    const allLinksMobile = allDefs.map(l => ({
      ...l,
      color: active === l.key ? 'var(--white)' : 'var(--text-body-dark)',
      weight: active === l.key ? 600 : 400,
    }));

    return {
      isDesktop: this.state.isDesktop,
      isMobile: !this.state.isDesktop,
      centerLinks,
      aboutColor: aboutActive ? 'var(--black)' : 'var(--gray-1)',
      aboutWeight: aboutActive ? 600 : 400,
      mobileOpen: this.state.mobileOpen,
      allLinksMobile,
      toggleMenu: () => this.setState(s => ({ mobileOpen: !s.mobileOpen })),
      closeMenu: () => this.setState({ mobileOpen: false }),
      drawerStyle: `position:fixed;top:0;right:0;height:100vh;width:min(84vw,340px);background:var(--black);border-left:1px solid var(--gray-3);z-index:150;transform:${this.state.mobileOpen ? 'translateX(0)' : 'translateX(100%)'};transition:transform 0.32s cubic-bezier(0.16,1,0.3,1);overflow-y:auto;box-sizing:border-box;`,
      backdropStyle: `position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:140;opacity:${this.state.mobileOpen ? 1 : 0};pointer-events:${this.state.mobileOpen ? 'auto' : 'none'};transition:opacity 0.3s ease;`,
    };
  }
}

</script>
</body>
</html>
