<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<button onClick="{{scrollToTop}}" aria-label="Back to top" style="position:fixed;left:24px;bottom:24px;z-index:150;width:48px;height:48px;border-radius:50%;background:var(--black);color:var(--white);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-overlay-card, 0 12px 28px rgba(0,0,0,0.22));opacity:{{opacity}};transform:{{transform}};pointer-events:{{pointerEvents}};transition:opacity 0.25s ease, transform 0.25s ease;" style-hover="opacity:{{hoverOpacity}};">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
</button>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { visible: false };

  componentDidMount() {
    this.onScroll = () => {
      const doc = document.documentElement;
      const scrollTop = window.scrollY || doc.scrollTop;
      const scrollable = (doc.scrollHeight || document.body.scrollHeight) - window.innerHeight;
      const ratio = scrollable > 0 ? scrollTop / scrollable : 0;
      const visible = ratio >= 0.7;
      if (visible !== this.state.visible) this.setState({ visible });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
  }

  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
  }

  scrollToTop = () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  renderVals() {
    const visible = this.state.visible;
    return {
      opacity: visible ? 1 : 0,
      hoverOpacity: visible ? 0.82 : 0,
      transform: visible ? 'translateY(0)' : 'translateY(12px)',
      pointerEvents: visible ? 'auto' : 'none',
      scrollToTop: this.scrollToTop,
    };
  }
}

</script>
</body>
</html>
